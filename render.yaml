services:
  # NetVigil FastAPI Production Web Service
  - type: web
    name: ai-driven-multi-vendor-network-security
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: netvigil-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_ENABLED
        value: "true"
      - key: SUPABASE_URL
        value: "https://cveymgeivgnjnwnxfveu.supabase.co"
      - key: SUPABASE_ANON_KEY
        value: "sb_publishable_-OjNhAi0G1ARbRjZEuZ3zQ_TM5pS0hN"
      - key: ALLOWED_HOSTS
        value: "ai-driven-multi-vendor-network-security.onrender.com,localhost,127.0.0.1"
      - key: CORS_ORIGINS
        value: "https://ai-driven-multi-vendor-network-security.vercel.app,https://ai-driven-multi-vendor-network-secu.vercel.app,http://localhost:3000"
    disk:
      name: netvigil-storage
      mountPath: /app/storage
      sizeGB: 1

databases:
  # NetVigil Managed Persistent PostgreSQL Database
  - name: netvigil-postgres
    plan: free
    databaseName: netvigil
    user: netvigil
    region: oregon

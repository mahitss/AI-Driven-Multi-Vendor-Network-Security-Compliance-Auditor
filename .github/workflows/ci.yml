name: NetVigil CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least-privilege default permissions for GITHUB_TOKEN
permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Pytest Suite & Supply Chain Hardening
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ENVIRONMENT: test
      SECRET_KEY: test-ci-pipeline-environment-secret-key-entropy-64
      SUPABASE_URL: https://test-ci.supabase.co
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pip-audit

      - name: Repository Secret Scan
        run: |
          python scripts/secret_scan.py --fail-on-findings

      - name: Backend Dependency Vulnerability Scan
        run: |
          pip-audit -r apps/api/requirements.txt --ignore-vuln GHSA-6w46-j5rx-g56g

      - name: Generate CycloneDX SBOM
        run: |
          python scripts/generate_sbom.py backend-sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json
          retention-days: 14

      - name: Run Backend Pytest Suite
        run: |
          pytest apps/api/tests -v

  frontend-build:
    name: Frontend Next.js Build & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies (Deterministic Lockfile)
        working-directory: apps/web
        run: npm ci

      - name: Security Vulnerability Scan
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: TypeScript Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Next.js Web App
        working-directory: apps/web
        run: npm run build

name: NetVigil CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest Suite & Security Hardening
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SECRET_KEY: test-ci-pipeline-environment-secret-key-entropy-64
      SUPABASE_URL: https://test-ci.supabase.co
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Pytest Suite
        run: |
          pytest apps/api/tests -v

  frontend-build:
    name: Frontend Next.js Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm install

      - name: Security Vulnerability Scan
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: TypeScript Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Next.js Web App
        working-directory: apps/web
        run: npm run build

## NetVigil Sample Network Configuration
## Vendor: Juniper Networks
## Platform: JunOS 21.4R3-S2 (SRX345 Services Gateway)
## Architecture: Perimeter Security Firewall
##
version 21.4R3-S2;
system {
    host-name FW-PERIMETER-01;
    domain-name netvigil.internal;
    time-zone Asia/Kolkata;
    root-authentication {
        encrypted-password "$6$kO9d8s7g$f9L1oP0q8s7d6f5g4h3j2k1l0m9n8b7v6c5x4z3a2s1d0f9";
    }
    name-server {
        10.100.10.10;
        10.100.10.11;
    }
    login {
        message "\n======================================================================\n                 AUTHORIZED GOV / NTRO ACCESS ONLY\n   All activities on this network node are continuously logged and\n   monitored. Unauthorized access is strictly prohibited.\n======================================================================\n";
        user admin-sec {
            uid 2001;
            class super-user;
            authentication {
                encrypted-password "$6$mO928s7d$09Lksjdf091283lkjdsf091823kjsdf091823ljksdf0";
            }
        }
    }
    services {
        ssh {
            protocol-version v2;
            ciphers [ aes256-gcm@openssh.com aes128-gcm@openssh.com ];
            connection-limit 10;
            rate-limit 5;
        }
        netconf {
            ssh;
        }
    }
    syslog {
        archive size 100k files 5;
        user * {
            any emergency;
        }
        host 10.100.20.50 {
            any notice;
            authorization info;
            facility-override local0;
            structured-data;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
    ntp {
        server 10.100.5.1 prefer;
        server 10.100.5.2;
    }
}
interfaces {
    ge-0/0/0 {
        description "EXTERNAL-WAN-UNTRUST";
        unit 0 {
            family inet {
                address 203.0.113.10/29;
            }
        }
    }
    ge-0/0/1 {
        description "INTERNAL-LAN-TRUST";
        unit 0 {
            family inet {
                address 10.100.1.1/24;
            }
        }
    }
    ge-0/0/2 {
        description "DMZ-SEGMENT";
        unit 0 {
            family inet {
                address 192.168.100.1/24;
            }
        }
    }
    fxp0 {
        description "OUT-OF-BAND-MGMT";
        unit 0 {
            family inet {
                address 10.254.0.10/24;
            }
        }
    }
}
security {
    screen {
        ids-option untrust-screen {
            icmp {
                ping-death;
                flood threshold 1000;
            }
            ip {
                source-route-option;
                tear-drop;
                bad-option;
            }
            tcp {
                syn-flood {
                    alarm-threshold 1024;
                    attack-threshold 200;
                    source-threshold 1024;
                    destination-threshold 2048;
                    timeout 20;
                }
                land;
                syn-fin;
                winnuke;
            }
        }
    }
    zones {
        security-zone trust {
            host-inbound-traffic {
                system-services {
                    ping;
                    ssh;
                    traceroute;
                }
            }
            interfaces {
                ge-0/0/1.0;
            }
        }
        security-zone untrust {
            screen untrust-screen;
            interfaces {
                ge-0/0/0.0;
            }
        }
        security-zone dmz {
            interfaces {
                ge-0/0/2.0;
            }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy allow-internal-web {
                match {
                    source-address any;
                    destination-address any;
                    application [ junos-http junos-https junos-dns-udp junos-ntp ];
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
        }
        from-zone untrust to-zone dmz {
            policy allow-dmz-https {
                match {
                    source-address any;
                    destination-address any;
                    application junos-https;
                }
                then {
                    permit;
                }
            }
        }
        default-policy {
            deny-all;
        }
    }
}

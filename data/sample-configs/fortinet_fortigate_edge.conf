#config-version=FG60F-7.2.4-FW-build1396-230308:opmode=0:vdom=0:user=admin
# NetVigil Sample Network Configuration
# Vendor: Fortinet
# Platform: FortiOS 7.2.4 (FortiGate 60F Edge Gateway)
# Architecture: Branch / Edge Security Gateway
#
config system global
    set hostname "EDGE-FGT-BRANCH-01"
    set timezone "80"
    set admintimeout 10
    set admin-sport 8443
    set admin-ssh-port 22
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set pre-login-banner enable
    set post-login-banner disable
    set strong-crypto enable
end

config system interface
    edit "wan1"
        set vdom "root"
        set mode static
        set ip 198.51.100.2 255.255.255.248
        set allowaccess ping
        set type physical
        set description "PRIMARY-ISP-WAN"
    next
    edit "lan"
        set vdom "root"
        set ip 10.200.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type hard-switch
        set description "INTERNAL-OFFICE-LAN"
    next
end

config system ntp
    set ntpserver "10.100.5.1" "10.100.5.2"
    set type custom
    set syncinterval 60
end

config log syslogd setting
    set status enable
    set server "10.100.20.50"
    set mode udp
    set port 514
    set facility local7
    set source-ip "10.200.1.1"
    set format default
end

config user local
    edit "secops_admin"
        set type password
        set passwd-policy "strong_password_policy"
        set two-factor disable
    next
end

config firewall policy
    edit 1
        set name "LAN_TO_WAN_INTERNET"
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL_TCP" "ALL_UDP"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
        set nat enable
    next
    edit 2
        set name "DENY_ALL_UNSOLICITED"
        set srcintf "wan1"
        set dstintf "lan"
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

config router static
    edit 1
        set gateway 198.51.100.1
        set device "wan1"
    next
end

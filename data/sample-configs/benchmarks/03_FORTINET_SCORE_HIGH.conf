config system global
    set hostname "SCORE-TEST-FORTINET-HIGH"
end
config system settings
    set admin-https-redirect enable
    set admin-sport 443
end
config system interface
    edit "wan1"
        set ip 203.0.113.10 255.255.255.0
        set allowaccess ping https ssh
    next
    edit "lan"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping https ssh
    next
end
config system admin
    edit "netadmin"
        set accprofile "super_admin"
        set password ENC_STRONG_PLACEHOLDER
        set trusthost1 10.20.0.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
config system snmp community
    edit 1
        set name "NETVIGIL-RO"
        set hosts
            edit 1
                set ip 10.20.0.50 255.255.255.255
            next
        end
    next
end

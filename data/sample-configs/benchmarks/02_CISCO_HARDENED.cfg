version 15.2
hostname TEST-CISCO-HARDENED
aaa new-model
aaa authentication login default local
service password-encryption
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
interface GigabitEthernet0/0
 ip address 203.0.113.20 255.255.255.252
 no shutdown
line vty 0 4
 transport input ssh
 login local
end

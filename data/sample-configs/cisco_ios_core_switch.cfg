! NetVigil Sample Network Configuration
! Vendor: Cisco Systems
! Platform: Cisco IOS-XE Software (Catalyst 9300 Series)
! Architecture: Core Distribution Layer Switch
!
version 17.3
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service sequence-numbers
no service finger
no service pad
no service tcp-small-servers
no service udp-small-servers
!
hostname CORE-SW-HQ-01
!
boot-start-marker
boot-end-marker
!
vrf definition MGMT-VRF
 description Out-of-band management VRF
 address-family ipv4
 exit-address-family
!
logging buffered 65536 informational
logging trap informational
logging host 10.100.20.50
logging host 10.100.20.51
logging source-interface Loopback0
!
aaa new-model
!
aaa authentication login default group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa authorization exec default group tacacs+ local 
aaa authorization commands 15 default group tacacs+ local 
aaa accounting exec default start-stop group tacacs+
aaa accounting commands 15 default start-stop group tacacs+
!
aaa session-id common
!
enable secret 9 $9$J8f0d83jLk92.kE109k$O8L1iKj.1mQ09s8v7x6
!
username netsec_admin privilege 15 algorithm-type scrypt secret 9 $9$K1029jSkdi01.Lkso$Z9k1092837465lks
username noc_operator privilege 5 algorithm-type scrypt secret 9 $9$L0192837465.Mlsod$P109283746567890
!
ip domain name corp.netvigil.internal
ip name-server 10.100.10.10 10.100.10.11
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm encryption aes256-gcm aes128-gcm
!
no ip http server
ip http secure-server
ip http secure-protocol TLSv1.2 TLSv1.3
!
no ip source-route
no ip proxy-arp
no ip directed-broadcast
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
ntp server 10.100.5.1 key 1 prefer
ntp server 10.100.5.2 key 1
ntp authenticate
ntp trusted-key 1
ntp authentication-key 1 md5 0822404F1A0A 7
!
banner motd ^C
======================================================================
                 AUTHORIZED GOV / NTRO ACCESS ONLY
   All activities on this network node are continuously logged and
   monitored. Unauthorized access is strictly prohibited and subject
   to immediate prosecution under applicable computer crime statutes.
======================================================================
^C
!
ip access-list extended ACL_MGMT_VTY_INBOUND
 10 permit tcp 10.100.200.0 0.0.0.255 any eq 22
 20 permit tcp 10.100.201.0 0.0.0.255 any eq 22
 30 deny ip any any log
!
ip access-list extended ACL_CONTROL_PLANE_PROTECT
 10 permit ospf any any
 20 permit tcp 10.100.0.0 0.0.255.255 eq 22 any
 30 permit udp any eq 123 any
 40 permit icmp any any echo-reply
 50 deny ip any any log
!
interface Loopback0
 description Management Loopback Interface
 ip address 10.100.0.1 255.255.255.255
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
interface GigabitEthernet1/0/1
 description UPLINK-TO-FIREWALL-PRI
 no switchport
 ip address 10.255.1.1 255.255.255.252
 no ip redirects
 no ip proxy-arp
 ip access-group ACL_CONTROL_PLANE_PROTECT in
!
interface GigabitEthernet1/0/2
 description UPLINK-TO-FIREWALL-SEC
 no switchport
 ip address 10.255.1.5 255.255.255.252
 no ip redirects
 no ip proxy-arp
!
interface GigabitEthernet1/0/24
 description TRUNK-TO-ACCESS-SWITCH-01
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,100
 switchport nonegotiate
!
line con 0
 exec-timeout 5 0
 stopbits 1
 transport output none
 login authentication default
!
line vty 0 4
 exec-timeout 10 0
 ipv6 access-class ACL_MGMT_VTY_INBOUND in
 access-class ACL_MGMT_VTY_INBOUND in
 transport input ssh
 transport output none
 login authentication default
!
line vty 5 15
 exec-timeout 10 0
 access-class ACL_MGMT_VTY_INBOUND in
 transport input ssh
 transport output none
 login authentication default
!
end

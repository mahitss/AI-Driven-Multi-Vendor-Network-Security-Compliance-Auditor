system {
    host-name NTRO-JUNIPER-SRX-01;
    services {
        ssh {
            protocol-version v2;
            connection-limit 5;
            rate-limit 3;
        }
    }
    syslog {
        host 10.10.100.50 {
            any warning;
            authorization info;
        }
    }
    ntp {
        server 10.10.100.1;
    }
}

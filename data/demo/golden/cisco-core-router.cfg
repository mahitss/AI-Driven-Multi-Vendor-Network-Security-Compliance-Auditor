! =============================================================
! NetVigil Canonical Golden Demo Dataset: Perimeter Core Gateway
! Hostname: CORE-RTR-01
! Platform: Cisco IOS 15.0
! Used for 2-Minute SIH Evaluator Demonstration
! =============================================================
version 15.0
no service password-encryption
service finger
hostname CORE-RTR-01
!
no aaa new-model
username admin privilege 15 password 0 cisco123
enable password unencrypted_enable_secret
!
ip domain name internal.lab
ip ssh version 1
ip http server
no ip http secure-server
!
interface GigabitEthernet0/0
 description UNTRUSTED-WAN-INTERFACE
 ip address 203.0.113.1 255.255.255.0
 ip proxy-arp
 ip directed-broadcast
!
interface GigabitEthernet0/1
 description INTERNAL-TRUSTED-LAN
 ip address 192.168.10.1 255.255.255.0
 no ip proxy-arp
!
! Note: Remote logging host missing
! Note: Authoritative NTP server missing
!
! Unseen directive for Adaptive Training demonstration:
control-plane policing policy-map COPP_MGMT_POLICY
!
line con 0
 password consolepass
line vty 0 4
 transport input telnet ssh
 password vtypass
 login
!
end

version: "3.8"

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: netvigil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-netvigil}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netvigil"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NetVigil FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: netvigil-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/netvigil}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/netvigil}
      STORAGE_PATH: /app/storage/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://web:3000}
      WORKER_GO_URL: ${WORKER_GO_URL:-http://worker-go:8081}
      WORKER_GO_ENABLED: ${WORKER_GO_ENABLED:-false}
      WORKER_INTERNAL_SECRET: ${WORKER_INTERNAL_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - storage_uploads:/app/storage/uploads

  # NetVigil Next.js Web UI
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: netvigil-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"

  # NetVigil Go Worker (Optional Background Infrastructure)
  worker-go:
    build:
      context: services/worker-go
      dockerfile: Dockerfile
    container_name: netvigil-worker-go
    restart: unless-stopped
    environment:
      PORT: 8081
      WORKER_PORT: 8081
      WORKER_ENV: ${ENVIRONMENT:-production}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
      WORKER_INTERNAL_SECRET: ${WORKER_INTERNAL_SECRET:-}
    ports:
      - "8081:8081"

volumes:
  postgres_data:
  storage_uploads:
